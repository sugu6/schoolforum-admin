<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#165DFF" />
    <title>海语校园论坛后台</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self' http://localhost:* https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #f7f8fa;
        }
        .app-loading-spinner {
          width: 36px;
          height: 36px;
          border: 3px solid #e5e6eb;
          border-top-color: #165dff;
          border-radius: 50%;
          animation: app-spin 0.8s linear infinite;
        }
        .app-loading-text {
          margin-top: 16px;
          color: #86909c;
          font-size: 14px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        @keyframes app-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
